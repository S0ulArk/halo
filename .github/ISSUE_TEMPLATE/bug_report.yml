name: Bug report
description: Something in Halo is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Halo version
      description: More › About › Version
      placeholder: "1.22.4"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "OnePlus 13, Android 16"
    validations:
      required: true
  - type: input
    id: tracker
    attributes:
      label: Tracker
      placeholder: "Fitbit Air via Google Health"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
